name: Calibre plugin release

# Push a tag like plugin-v1.2.0 -> build the plugin zip, publish a GitHub
# release with the matching CHANGELOG.md section as notes, then update the
# MobileRead plugin thread (swap the attached zip, refresh Version History).
#
# The MobileRead step runs on tag pushes only when the repository variable
# MOBILEREAD_AUTO is "true".
#
# Run manually (Actions -> Calibre plugin release -> Run workflow) to redo only
# the MobileRead step with the latest release; dry run by default. Use the
# second post of the thread (4616176, "Reserved for test versions") to test.
on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "MobileRead: only log in and show what would change"
        type: boolean
        default: true
      post:
        description: "Post id (4616175 = plugin first post, 4616176 = test post)"
        type: string
        default: "4616175"
      attachments_only:
        description: "Leave the post text alone (use for the test post)"
        type: boolean
        default: false
      test_variant:
        description: "Test only: add a marker file so the zip differs from the attached one"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER=$(python3 -c "import re;print('.'.join(re.search(r'version\s*=\s*\((\d+),\s*(\d+),\s*(\d+)\)', open('calibre-plugin/__init__.py').read()).groups()))")
          echo "plugin version: $VER, tag: $TAG"
          [ "$TAG" = "plugin-v$VER" ] || { echo "::error::tag $TAG does not match __init__.py version $VER"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          python3 - <<'PY'
          import os, re, sys
          ver = os.environ["VER"]
          text = open("calibre-plugin/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## %s\s*\n(.*?)(?=^## |\Z)" % re.escape(ver), text, re.S | re.M)
          if not m:
              sys.exit("::error::no '## %s' section in calibre-plugin/CHANGELOG.md" % ver)
          open("notes.md", "w", encoding="utf-8").write(
              m.group(1).strip() + "\n\n**Install:** Calibre -> Preferences -> Plugins -> "
              "Load plugin from file -> `kindle_reading_dashboard.zip`, then restart Calibre.\n")
          PY

      - name: Build plugin zip
        run: python3 calibre-plugin/build.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" calibre-plugin/kindle_reading_dashboard.zip \
            --repo "$GITHUB_REPOSITORY" --title "Calibre plugin v$VER" \
            --notes-file notes.md --latest

  mobileread:
    needs: release
    # after a successful tag release, or on its own when run manually
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.release.result == 'success' && vars.MOBILEREAD_AUTO == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get the release zip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern kindle_reading_dashboard.zip --dir dist

      - name: Update the MobileRead plugin thread
        env:
          MOBILEREAD_USER: ${{ secrets.MOBILEREAD_USER }}
          MOBILEREAD_PASSWORD: ${{ secrets.MOBILEREAD_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          POST: ${{ inputs.post || '4616175' }}
          ATTACHMENTS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.attachments_only }}
          TEST_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_variant }}
        run: |
          pip install --quiet requests==2.32.3
          ARGS="--post $POST"
          [ -f dist/kindle_reading_dashboard.zip ] && ARGS="$ARGS --zip dist/kindle_reading_dashboard.zip"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$ATTACHMENTS_ONLY" = "true" ] && ARGS="$ARGS --attachments-only"
          [ "$TEST_VARIANT" = "true" ] && ARGS="$ARGS --test-variant"
          python3 tools/mobileread_update.py $ARGS
